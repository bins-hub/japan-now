<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>JAPULSE validation</title><style>body{margin:0;font:14px system-ui;background:#edf2f0;color:#183b30}header{position:sticky;top:0;background:#fff;padding:12px;z-index:2;display:flex;gap:10px;flex-wrap:wrap;align-items:center}iframe{display:block;border:1px solid #aabbb2;margin:12px;background:white;height:900px}button,select{padding:8px}pre{white-space:pre-wrap;max-height:320px;overflow:auto;background:#fff;padding:12px}#progress{font-weight:700}#results{margin:12px}h1{font-size:18px;margin:0}</style></head><body><header><h1>JAPULSE validation</h1><button id="run">Audit all pages</button><button id="stop">Stop</button><select id="page"></select><select id="width"><option>360</option><option>390</option><option>768</option><option>1366</option></select><button id="open">Open preview</button><span id="progress">Ready</span></header><div id="results"><pre id="summary"></pre><pre id="issues"></pre></div><iframe id="frame" title="Responsive page preview"></iframe><script>
const frame=document.getElementById('frame'),page=document.getElementById('page'),width=document.getElementById('width'),progress=document.getElementById('progress'),summary=document.getElementById('summary'),issues=document.getElementById('issues');let stopped=false,results=[];
function audit(){
 const w=frame.contentWindow,d=w.document,rgb=s=>(s.match(/[\d.]+/g)||[]).map(Number),blend=(a,b)=>[0,1,2].map(i=>a[i]*(a[3]??1)+b[i]*(1-(a[3]??1)));
 const lum=a=>a.slice(0,3).map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0);
 const contrast=[],clipped=[],seen=new Set(),unnamed=[];let texts=0;
 for(const e of d.querySelectorAll('body *')){
  const text=[...e.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent.trim()).join(' ').trim();
  if(!text||!e.getClientRects().length)continue;
  const c=w.getComputedStyle(e);if(c.visibility==='hidden'||c.display==='none'||+c.opacity<.5||e.closest('[aria-hidden=true]'))continue;texts++;
  let bg=[255,255,255],hasImage=false,chain=[],scrollable=false;
  for(let p=e;p;p=p.parentElement)chain.unshift(p);
  for(const p of chain){const s=w.getComputedStyle(p),v=rgb(s.backgroundColor);if((v[3]??1)===1)hasImage=false;if(s.backgroundImage!=='none')hasImage=true;if(/auto|scroll/.test(s.overflowX)&&p.scrollWidth>p.clientWidth)scrollable=true;bg=blend(v,bg);}
  const fg=blend(rgb(c.color),bg),a=lum(fg),b=lum(bg),ratio=(Math.max(a,b)+.05)/(Math.min(a,b)+.05),large=parseFloat(c.fontSize)>=24||(parseFloat(c.fontSize)>=18.66&&parseInt(c.fontWeight)>=700),key=c.color+'|'+bg+'|'+e.tagName+'|'+e.className;
  if(!hasImage&&ratio<(large?3:4.5)&&!seen.has(key)){seen.add(key);contrast.push({tag:e.tagName,cls:e.className,text:text.slice(0,75),color:c.color,bg:bg.map(Math.round),ratio:+ratio.toFixed(2)});}
  const rect=e.getBoundingClientRect();if(!scrollable&&(rect.left< -2||rect.right>w.innerWidth+2)&&clipped.length<12)clipped.push({tag:e.tagName,cls:e.className,text:text.slice(0,65),left:Math.round(rect.left),right:Math.round(rect.right)});
 }
 for(const e of d.querySelectorAll('button,input:not([type=hidden]),select')){if(!e.getClientRects().length)continue;const name=e.getAttribute('aria-label')||e.getAttribute('title')||e.textContent.trim()||e.labels?.[0]?.textContent||e.getAttribute('placeholder');if(!name)unnamed.push({tag:e.tagName,id:e.id});}
 const missingAlt=[...d.images].filter(e=>!e.hasAttribute('alt')).map(e=>e.getAttribute('src')).slice(0,10);
 const brokenImages=[...d.images].filter(e=>e.complete&&!e.naturalWidth&&e.currentSrc).map(e=>e.currentSrc).slice(0,10);
 return{path:w.location.pathname,width:w.innerWidth,texts,overflow:d.documentElement.scrollWidth>w.innerWidth+2,contrast,clipped,unnamed,missingAlt,brokenImages};
}
function show(){summary.textContent=JSON.stringify({checked:results.length,problems:results.filter(r=>r.error||r.overflow||r.contrast?.length||r.clipped?.length||r.unnamed?.length||r.missingAlt?.length||r.brokenImages?.length).length},null,2);issues.textContent=JSON.stringify(results.filter(r=>r.error||r.overflow||r.contrast?.length||r.clipped?.length||r.unnamed?.length||r.missingAlt?.length||r.brokenImages?.length),null,2);window.validationResults=results;}
async function load(path,size){frame.style.width=size+'px';width.value=String(size);page.value=path;await new Promise(resolve=>{let timer=setTimeout(resolve,18000);frame.onload=()=>{clearTimeout(timer);resolve();};frame.src=path+'?validation=20261026';});await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));try{return audit();}catch(e){return{path,width:size,error:String(e)};}}
fetch('/sitemap.xml').then(r=>r.text()).then(s=>{const xml=new DOMParser().parseFromString(s,'application/xml');const paths=[...xml.getElementsByTagName('loc')].map(e=>new URL(e.textContent).pathname);for(const p of paths){const o=document.createElement('option');o.value=p;o.textContent=p;page.append(o);}progress.textContent='Ready: '+paths.length+' pages';document.getElementById('run').onclick=async()=>{stopped=false;results=[];for(const size of [390,1366]){for(const path of paths){if(stopped)break;progress.textContent='Checking '+(results.length+1)+' / '+(paths.length*2)+' · '+size+' · '+path;results.push(await load(path,size));show();}if(stopped)break;}progress.textContent=stopped?'Stopped':'Complete';};document.getElementById('open').onclick=async()=>{const r=await load(page.value,+width.value);summary.textContent=JSON.stringify(r,null,2);};});document.getElementById('stop').onclick=()=>{stopped=true;};
</script></body></html>
