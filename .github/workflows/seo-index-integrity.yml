name: SEO index integrity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sitemap and multilingual indexing signals
        run: node tools/check_index_integrity.cjs
      - name: Match FAQ structured data to readable page content
        run: python3 tools/check_faq_visibility.py
      - name: Enforce search metadata parity in all four languages
        run: python3 tools/check_search_metadata_parity.py
      - name: Check animated route JavaScript syntax
        run: |
          node --check assets/run-route-visuals.js
          node --check tools/check_route_visuals.cjs
      - name: Validate route start-to-finish animations
        run: node tools/check_route_visuals.cjs
      - name: Verify enhanced RUN EAT content and client-side scripts
        run: |
          node --check assets/run-eat-plus.js
          node --check assets/run-route-visuals.js
          node --check tools/check_run_eat_plus.cjs
          node tools/check_run_eat_plus.cjs
      - name: Validate MOVE routes, scripts and SEO
        run: node tools/check_move_integrity.cjs
      - name: Audit sitewide internal links
        run: node tools/check_site_links.cjs
      - name: Audit localized content parity across all pages
        run: node tools/audit_i18n_parity.cjs
      - name: Audit responsive and policy navigation
        run: node tools/check_mobile_policy.cjs
      - name: Enforce locale navigation and homepage camera parity
        run: node tools/check_locale_navigation.cjs
      - name: Verify weather on dynamic cards and provider timeouts
        run: node tools/check_weather_dynamic.cjs
      - name: Keep ONSEN and MOVE identical to the Korean source
        run: node tools/check_guide_source_parity.cjs
      - name: Verify localized MOVE search regardless of letter case
        run: node tools/check_move_search.cjs
