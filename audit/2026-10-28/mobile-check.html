<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>JAPULSE 반응형 점검 도구</title><style>body{margin:0;background:#e7edef;color:#102832;font:14px/1.6 system-ui}header{max-width:820px;margin:auto;padding:14px}label{display:inline-block;margin:4px}select{padding:8px;max-width:280px}p{margin:5px 0}iframe{display:block;width:390px;height:844px;border:2px solid #5f7d85;background:white;margin:0 auto 30px;max-width:calc(100vw - 8px)}a{color:#164d60}</style><header><strong>JAPULSE 실제 사이트 반응형 점검</strong><p>아래 프레임은 배포된 사이트를 실제 360·390·768px 너비로 엽니다. 모바일 사용자 에이전트·터치 기기를 흉내 내지는 않습니다.</p><label>언어 <select id="locale" aria-label="검사 언어"><option value="">한국어</option><option value="en/">English</option><option value="ja/">日本語</option><option value="zh-cn/">简体中文</option></select></label><label>페이지 <select id="route" aria-label="검사 페이지"></select></label><label>너비 <select id="width" aria-label="화면 너비"><option>390</option><option>360</option><option>768</option></select></label><p><a id="original" target="_blank" rel="noopener">원본 페이지 열기 ↗</a> · <span id="status" aria-live="polite"></span></p></header><iframe id="preview" title="실제 사이트 모바일 너비 미리보기"></iframe><script>const routes=["", "about/", "cameras/arashiyama/", "cameras/dotonbori/", "cameras/fuji/", "cameras/hakata/", "cameras/haneda/", "cameras/iki/", "cameras/kabukicho/", "cameras/okinawa/", "cameras/osaka-sky/", "cameras/sapporo/", "cameras/sensoji/", "cameras/shibuya/", "contact/", "guides/camera-troubleshooting/", "guides/travel-prep/", "guides/where-to-watch/", "live/", "local-food/", "move/", "move/haneda-hamamatsucho/", "move/haneda-shinagawa/", "move/kansai-kyoto/", "move/kansai-namba/", "move/kansai-shin-osaka/", "move/kyoto-arashiyama/", "move/kyoto-nara/", "move/narita-shinjuku/", "move/narita-ueno/", "move/new-chitose-sapporo/", "move/osaka-kobe/", "move/osaka-kyoto/", "move/osaka-nara/", "move/sapporo-otaru/", "move/shinjuku-kawaguchiko/", "move/tokyo-hakone/", "move/tokyo-kamakura/", "now/", "onsen/", "onsen/arima/", "onsen/atami/", "onsen/beppu/", "onsen/dogo/", "onsen/gero/", "onsen/ginzan/", "onsen/hakone/", "onsen/jozankei/", "onsen/kaga/", "onsen/kinosaki/", "onsen/kinugawa/", "onsen/kusatsu/", "onsen/noboribetsu/", "onsen/shibu/", "onsen/yufuin/", "privacy/", "regions/fuji/", "regions/hokkaido/", "regions/kyoto/", "regions/kyushu/", "regions/osaka/", "regions/tokyo/", "run-eat/", "season/", "season/autumn/kyoto/", "season/autumn/osaka/", "season/autumn/sapporo/", "season/autumn/tokyo/", "season/cherry-blossoms/kyoto/", "season/cherry-blossoms/osaka/", "season/cherry-blossoms/sapporo/", "season/cherry-blossoms/tokyo/", "season/winter/kyoto/", "season/winter/osaka/", "season/winter/sapporo/", "season/winter/tokyo/"];const language=document.getElementById('locale'),route=document.getElementById('route'),width=document.getElementById('width'),frame=document.getElementById('preview');for(const path of routes){const option=document.createElement('option');option.value=path;option.textContent='/'+path;route.append(option)}route.value='onsen/';function load(){const url='https://japulse.com/'+language.value+route.value;frame.src=url;document.getElementById('original').href=url;document.getElementById('status').textContent=width.value+'px · '+url}language.addEventListener('change',load);route.addEventListener('change',load);width.addEventListener('change',()=>{frame.style.width=width.value+'px';document.getElementById('status').textContent=width.value+'px · '+frame.src});load();</script></html>
